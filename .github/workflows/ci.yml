name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Lint:
    runs-on: macos-14
    if: github.repository == 'manzt/signals'

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.6"
      - run: uv run ruff check

  Test:
    runs-on: macos-14
    if: github.repository == 'manzt/signals'

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.6"
      - run: uv run pytest
