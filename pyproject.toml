[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signals"
version = "0.1.0a4"
description = "Primitives for transparent reactive programming in Python"
authors = [{ name = "Trevor Manz", email = "trevor.j.manz@gmail.com" }]
dependencies = ["signals"]
readme = "README.md"
requires-python = ">= 3.8"

[tool.uv]
dev-dependencies = ["pytest>=8.1.2", "ruff>=0.6.1"]

[tool.uv.sources]
signals = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
preview = true
pydocstyle = { convention = "numpy" }
select = ["ALL"]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"src/signals/__init__.py" = ["F401"]
"tests/*.py" = [
    "D",       # no docstrings
    "S",       # asserts in test functions
    "PLR2004", # Magic value used in comparison
    "INP001",  # Implicit package
]
