[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signals"
version = "0.1.0a4"
description = "Primitives for transparent reactive programming in Python"
authors = [{ name = "Trevor Manz", email = "trevor.j.manz@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.8"

[project.optional-dependencies]
inputs = ["anywidget>=0.9.0"]

[dependency-groups]
dev = [
    "anywidget[dev]>=0.9.13",
    "jupyterlab>=4.2.5",
    "polars>=1.7.1",
    "pytest>=8.1.2",
    "ruff>=0.6.8",
]

[tool.ruff.lint]
preview = true
pydocstyle = { convention = "numpy" }
select = ["ALL"]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"src/signals/__init__.py" = ["F401"]
"tests/*.py" = [
    "D",       # no docstrings
    "S",       # asserts in test functions
    "PLR2004", # Magic value used in comparison
    "INP001",  # Implicit package
]
